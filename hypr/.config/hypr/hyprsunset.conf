# Makes hyprsunset do nothing to the screen by default
# Without this, the default applies some tint to the monitor
profile {
    time = 07:00
    identity = true
}

# Night light from 21:00 until the 07:00 profile above, at the same 4000K the
# bar's Night Light toggle uses. The toggle still overrides it until the next
# switch.
profile {
    time = 21:00
    temperature = 4000
}
