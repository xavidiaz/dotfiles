<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Atkinson Hyperlegible Next for interface text: letters that are hard to
     mistake for each other (I l 1, O 0, b d p q). Kept out of fonts.conf,
     which `omarchy font set` rewrites to pick the monospace font. -->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Atkinson Hyperlegible Next</string>
    </edit>
  </match>
</fontconfig>
