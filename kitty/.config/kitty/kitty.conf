include ~/.local/state/omarchy/current/theme/kitty.conf

# Font
font_family AtkynsonMono Nerd Font
bold_italic_font auto
font_size 12.0
# A fifth more room between lines, easier to keep your place in long output
modify_font cell_height 120%

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Scrollback in LazyVim (kitty-scrollback.nvim): select with v/V/Ctrl-v or / search,
# y copies to the clipboard, Ctrl-Enter sends the selection to the prompt, q quits.
# Ctrl+Space (or Ctrl+Shift+H) for the whole scrollback, Ctrl+Shift+G for the last
# command's output, Ctrl+Shift+right-click on any command's output for just that
# output. Ctrl+Space stays tuios's leader while tuios runs: the tuios function in
# ~/.bashrc sets the in_tuios window variable for that time.
action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
map --when-focus-on "not var:in_tuios" ctrl+space kitty_scrollback_nvim
map kitty_mod+h kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard

# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Remote control only through the socket below, which kitty-scrollback.nvim uses
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# Aesthetics
cursor_shape block
cursor_blink_interval 0
# Bash sets the title itself (repo and branch, see ~/.bashrc)
shell_integration no-cursor no-title
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                top
tab_bar_min_tabs            1
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {custom}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Mouse selection goes straight to the clipboard (as in tuios).
copy_on_select clipboard
# Plain drag selects even when an app (Claude Code, tuios, nvim) grabbed the mouse.
mouse_map left press grabbed mouse_selection normal
mouse_map left doublepress grabbed mouse_selection word
mouse_map left triplepress grabbed mouse_selection line
mouse_map left click grabbed mouse_handle_click selection link prompt
